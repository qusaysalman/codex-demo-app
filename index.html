<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A tiny, friendly clock demo." />
    <title>Hello there!</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <span class="wave" aria-hidden="true">👋</span>
      <p class="eyebrow">A tiny hello</p>
      <h1>Welcome, friend!</h1>
      <p class="intro">It’s lovely to see you. Want to know what time it is?</p>

      <button id="time-button" type="button">Show me the time</button>
      <p id="time-display" class="time-display" aria-live="polite">
        Your local time will appear here.
      </p>

      <noscript>Please enable JavaScript to use the clock.</noscript>
    </main>

    <script src="script.js"></script>
  </body>
</html>
